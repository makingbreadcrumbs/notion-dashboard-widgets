<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: transparent;
        }
        
        .progress-widget {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .progress-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .progress-percentage {
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
        }
        
        .progress-subtitle {
            font-size: 12px;
            color: #9ca3af;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .progress-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 4px;
        }
        
        .colorush .progress-bar-fill {
            background: linear-gradient(90deg, #0d9488 0%, #14b8a6 100%);
        }
        
        .etsy .progress-bar-fill {
            background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%);
        }
        
        .personal .progress-bar-fill {
            background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
        }
        
        .progress-details {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="progress-widget colorush">
        <div class="progress-title">🎨 Colorush Q3 Projects</div>
        <div class="progress-label">
            <span class="progress-subtitle">Completion</span>
            <span class="progress-percentage" id="percent">65%</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="fill" style="width: 65%;"></div>
        </div>
        <div class="progress-details">
            <span>13 of 20 projects complete</span>
            <span>~7 weeks remaining</span>
        </div>
    </div>
    
    <script>
        // You can update this by changing the values below
        const currentProgress = 65;
        const totalItems = 20;
        const completedItems = 13;
        
        document.getElementById('percent').textContent = currentProgress + '%';
        document.getElementById('fill').style.width = currentProgress + '%';
    </script>
</body>
</html>
