<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: transparent;
        }
        
        .timer-widget {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 300px;
        }
        
        .timer-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        
        .timer-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .timer-time {
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #1f2937;
        }
        
        .timer-ampm {
            font-size: 12px;
            color: #9ca3af;
        }
        
        .timer-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            position: relative;
        }
        
        .colorush .timer-circle {
            background: linear-gradient(135deg, rgba(13, 148, 136, 0.1) 0%, rgba(20, 184, 166, 0.1) 100%);
            border: 2px solid #14b8a6;
        }
        
        .colorush .timer-circle-inner {
            color: #0d9488;
        }
        
        .etsy .timer-circle {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.1) 0%, rgba(245, 158, 11, 0.1) 100%);
            border: 2px solid #f59e0b;
        }
        
        .etsy .timer-circle-inner {
            color: #d97706;
        }
        
        .personal .timer-circle {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.1) 100%);
            border: 2px solid #60a5fa;
        }
        
        .personal .timer-circle-inner {
            color: #3b82f6;
        }
        
        .timer-circle-inner {
            text-align: center;
            font-weight: 600;
            line-height: 1.4;
        }
        
        .timer-hours {
            font-size: 32px;
        }
        
        .timer-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .timer-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        button {
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        .btn-start {
            background: #14b8a6;
            color: white;
        }
        
        .btn-reset {
            background: #f3f4f6;
            color: #374151;
        }
        
        .timer-session {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="timer-widget colorush">
        <div class="timer-title">⏱️ Today's Focus Time</div>
        
        <div class="timer-circle">
            <div class="timer-circle-inner">
                <div class="timer-hours" id="hours">2</div>
                <div class="timer-label">hours</div>
            </div>
        </div>
        
        <div class="timer-display">
            <span class="timer-time" id="time">14:32</span>
            <span class="timer-ampm">PM</span>
        </div>
        
        <div class="timer-buttons">
            <button class="btn-start" onclick="toggleTimer()">Start</button>
            <button class="btn-reset" onclick="resetTimer()">Reset</button>
        </div>
        
        <div class="timer-session">
            <strong>3 Pomodoro sessions done</strong><br>
            Goal: 5 sessions today
        </div>
    </div>
    
    <script>
        let totalMinutes = 154; // 2 hours 34 minutes
        let isRunning = false;
        let timerInterval;
        
        function updateDisplay() {
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            
            document.getElementById('hours').textContent = hours;
            document.getElementById('time').textContent = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0');
        }
        
        function toggleTimer() {
            isRunning = !isRunning;
            if (isRunning) {
                timerInterval = setInterval(() => {
                    totalMinutes++;
                    updateDisplay();
                }, 60000); // Update every minute
                document.querySelector('.btn-start').textContent = 'Pause';
            } else {
                clearInterval(timerInterval);
                document.querySelector('.btn-start').textContent = 'Resume';
            }
        }
        
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            totalMinutes = 0;
            updateDisplay();
            document.querySelector('.btn-start').textContent = 'Start';
        }
        
        updateDisplay();
    </script>
</body>
</html>
